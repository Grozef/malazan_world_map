<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carte du monde de Malazan</title>
  <link rel="stylesheet" href="assets/leaflet/leaflet.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <header class="topbar">
    <h1>Le Monde de Malazan</h1>
    <input id="search" type="search" placeholder="Rechercher une ville..." autocomplete="off">
    <span id="pickhint" class="pickhint" hidden>Mode pointeur : clique pour copier les coordonnees pixel</span>
  </header>
  <div id="map"></div>
  <div class="map-chrome" aria-hidden="true">
    <div class="frame"></div>
    <img class="corner tl" src="assets/corner.png" alt="">
    <img class="corner tr" src="assets/corner.png" alt="">
    <img class="corner br" src="assets/corner.png" alt="">
    <img class="corner bl" src="assets/corner.png" alt="">
    <img class="compass" src="assets/compass.png" alt="rose des vents">
  </div>
  <script src="assets/leaflet/leaflet.js"></script>
  <script src="assets/world.js"></script>
  <script src="assets/picker.js"></script>
</body>
</html>
